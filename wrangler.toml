# Cloudflare Worker configuration for Float.
#
# Deploy path: connect this GitHub repo in the Cloudflare dashboard (Workers &
# Pages -> Create -> connect to Git). Cloudflare builds and deploys on every push.
#
# Two things must be set up once in the dashboard (see README "Deploy to Cloudflare"):
#   1. A KV namespace bound as FLOAT_KV  -> paste its ID below.
#   2. A secret named APP_PASSWORD       -> your login password.

name = "float-budget"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Serves the ./static frontend (index.html, styles.css, app.js) for any non-/api route.
[assets]
directory = "./static"
binding = "ASSETS"

# Persistent storage for your budget (one JSON document under the key "state").
# Create the namespace in the dashboard, then replace the id below with the real one.
[[kv_namespaces]]
binding = "FLOAT_KV"
id = "a8af33899d03401bb3eb42382a5f07cd"
