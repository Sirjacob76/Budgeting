name: Build Android APK

# Builds an installable debug APK in the cloud on every push (and on demand).
# Download it from the run's "Artifacts" section, then install it on your phone.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.claude/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Generate app icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#17a066' --iconBackgroundColorDark '#17a066'

      - name: Copy web assets into the app
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: float-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
